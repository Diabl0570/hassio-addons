name: Verify Obot MCP Gateway

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python (v7.0.0)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install schema test dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Check entrypoint syntax
        run: bash -n obot/run.sh
      - name: Test app runtime configuration
        run: python3 -m unittest discover -s obot/tests -v
      - name: Test tool skill renderer
        run: python3 -m unittest discover -s tests -v
      - name: Build amd64 app image
        run: docker build --platform linux/amd64 --tag ha-obot:test obot
      - name: Verify authenticated startup and restart persistence
        run: python3 scripts/obot-smoke.py --image ha-obot:test
